name: Inventory Hub Regression Gate

on:
  push:
    branches: [main]
    paths:
      - "app.js"
      - "v7033-core.js"
      - "parser-v7-core.js"
      - "runtime-v7.03.3.*.js"
      - "modules/**"
      - "scripts/**"
      - "index.html"
      - "tests/**"
      - "supabase-v7-03-3-14o-parser-intelligence.sql"
      - "supabase-v7-03-3-14d-master-item-merge.sql"
      - "supabase-v7-03-3-14v-canonical-save.sql"
      - "supabase-v7-03-3-14x-data-health-resolution.sql"
      - ".github/workflows/database-migrations.yml"
      - "supabase-v7-03-3-14t-backup-verification.sql"
      - "BACKUP_VERIFICATION_SETUP-v7.03.3.14t.md"
      - ".github/workflows/inventory-regression.yml"
      - ".github/workflows/backup-verification.yml"
  pull_request:
    paths:
      - "app.js"
      - "v7033-core.js"
      - "parser-v7-core.js"
      - "runtime-v7.03.3.*.js"
      - "modules/**"
      - "scripts/**"
      - "index.html"
      - "tests/**"
      - "supabase-v7-03-3-14o-parser-intelligence.sql"
      - "supabase-v7-03-3-14d-master-item-merge.sql"
      - "supabase-v7-03-3-14v-canonical-save.sql"
      - "supabase-v7-03-3-14x-data-health-resolution.sql"
      - ".github/workflows/database-migrations.yml"
      - "supabase-v7-03-3-14t-backup-verification.sql"
      - "BACKUP_VERIFICATION_SETUP-v7.03.3.14t.md"
      - ".github/workflows/inventory-regression.yml"
      - ".github/workflows/backup-verification.yml"

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Package certification source
        run: tar --exclude=.git -czf /tmp/inventory-hub-shadow-source.tgz .
      - name: Upload certification source
        uses: actions/upload-artifact@v4
        with:
          name: inventory-hub-shadow-source
          path: /tmp/inventory-hub-shadow-source.tgz
          retention-days: 1
      - name: Package browser certification vendor
        run: |
          mkdir -p /tmp/cert-vendor
          npm pack pdfjs-dist@4.4.168 --pack-destination /tmp/cert-vendor
          npm pack tesseract.js@5.1.1 --pack-destination /tmp/cert-vendor
          npm pack tesseract.js-core@5.1.1 --pack-destination /tmp/cert-vendor
          curl -fsSL https://tessdata.projectnaptha.com/4.0.0/eng.traineddata.gz -o /tmp/cert-vendor/eng.traineddata.gz
      - name: Upload browser certification vendor
        uses: actions/upload-artifact@v4
        with:
          name: inventory-hub-certification-vendor
          path: /tmp/cert-vendor
          retention-days: 1
      - name: Package standalone certification Chromium
        run: |
          PLAYWRIGHT_BROWSERS_PATH=/tmp/pw-browsers npx --yes playwright@1.55.0 install chromium
          tar -C /tmp -czf /tmp/inventory-hub-certification-chromium.tgz pw-browsers
      - name: Upload standalone certification Chromium
        uses: actions/upload-artifact@v4
        with:
          name: inventory-hub-certification-chromium
          path: /tmp/inventory-hub-certification-chromium.tgz
          retention-days: 1
      - name: Syntax-check direct runtime and backup verifier
        run: |
          node --check app.js
          ACTIVE_RUNTIME="$(node -e "const fs=require('fs');const s=fs.readFileSync('app.js','utf8');const m=s.match(/loadScript\\('(runtime-v7\\.03\\.3\\.14[a-z]+\\.js)\\?v='/);if(!m)process.exit(2);process.stdout.write(m[1]);")"
          echo "Syntax-checking active runtime: $ACTIVE_RUNTIME"
          node --check "$ACTIVE_RUNTIME"
          node --check modules/document-authority-v411-recovery1.js
          node --check modules/parser-evidence-engine.js
          node --check modules/parser-v2/evidence-model.js
          node --check modules/parser-v2/header-resolver.js
          node --check modules/parser-v2/table-detector.js
          node --check modules/parser-v2/row-builder.js
          node --check modules/parser-v2/row-accounting.js
          node --check modules/parser-v2/numbered-schedule.js
          node --check modules/parser-v2/engine.js
          node --check modules/parser-v2/verification-gate.js
          node --check modules/parser-v3/engine.js
          node --check modules/parser-v4-review-bridge.js
          node --check modules/parser-v4_1-shadow.js
          node --check modules/parser-v411-cell-ocr-bridge.js
          node --check modules/parser-v411-fixes1-5-shadow.js
          node --check modules/parser-table.js
          node --check modules/grouped-company-ui.js
          node --check modules/backup-verification-ui.js
          node --check scripts/verify-backups.mjs
      - name: Run parser, module, backup and release regression gates
        run: |
          node tests/run-regression.cjs
          node tests/v411-document-authority-hard-reject.cjs
          node tests/parser-v4-unseen-holdout.cjs
          node tests/parser-v4-concept-sanitized.cjs
          node tests/parser-v4-serial-evidence.cjs
          node tests/parser-v4_1-random-character-shadow.cjs
          node tests/parser-v4_1-targeted-recovery.cjs
          node tests/parser-v4_1-phase1-fair-raw-input.cjs
          node tests/parser-v4_1-phase2-ocr-stress-safe.cjs
          node tests/parser-v4_1-phase3-e2e-authority.cjs
          node tests/parser-v4_1-phase3-concept-actual-ocr.cjs
          node tests/parser-v4_1-phase4-production-integration.cjs
          node tests/parser-v4_1-phase4-concept-live-failure.cjs
          node tests/parser-v4_1-phase4-live-diagnostic-parity.cjs
          node tests/parser-v4_1-phase4-cross-ocr-dedupe.cjs
          node tests/parser-v4_1-phase4-generalized-unseen-ocr.cjs
          node tests/parser-v4_1-phase4-row-local-model-evidence.cjs
          node tests/parser-v4_1-phase4-nearby-model-evidence.cjs
          node tests/parser-v4_1-phase4-identity-quality-r7.cjs
          node tests/parser-v4_1-stacked-row-local-identity-shadow.cjs
          node tests/parser-v4_1-stacked-row-preprod-parity.cjs
          node tests/parser-v4_1-final-live-production-parity-shadow.cjs
          node tests/parser-v411-fixes1-15-runtime-integration.cjs
          node tests/parser-v4_1-lta-aerospace-concept-multitest.cjs
          node tests/merge-dialog-close-regression.cjs
          node tests/recent-inventory-futuristic-artwork.cjs