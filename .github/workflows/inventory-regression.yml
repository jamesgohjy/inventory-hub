name: Inventory Hub Regression Gate

on:
  push:
    branches: [main]
    paths:
      - "app.js"
      - "v7033-core.js"
      - "parser-v7-core.js"
      - "runtime-v7.03.3.*.js"
      - "modules/**"
      - "scripts/**"
      - "index.html"
      - "tests/**"
      - "supabase-v7-03-3-14o-parser-intelligence.sql"
      - "supabase-v7-03-3-14d-master-item-merge.sql"
      - "supabase-v7-03-3-14v-canonical-save.sql"
      - "supabase-v7-03-3-14x-data-health-resolution.sql"
      - ".github/workflows/database-migrations.yml"
      - "supabase-v7-03-3-14t-backup-verification.sql"
      - "BACKUP_VERIFICATION_SETUP-v7.03.3.14t.md"
      - ".github/workflows/inventory-regression.yml"
      - ".github/workflows/backup-verification.yml"
  pull_request:
    paths:
      - "app.js"
      - "v7033-core.js"
      - "parser-v7-core.js"
      - "runtime-v7.03.3.*.js"
      - "modules/**"
      - "scripts/**"
      - "index.html"
      - "tests/**"
      - "supabase-v7-03-3-14o-parser-intelligence.sql"
      - "supabase-v7-03-3-14d-master-item-merge.sql"
      - "supabase-v7-03-3-14v-canonical-save.sql"
      - "supabase-v7-03-3-14x-data-health-resolution.sql"
      - ".github/workflows/database-migrations.yml"
      - "supabase-v7-03-3-14t-backup-verification.sql"
      - "BACKUP_VERIFICATION_SETUP-v7.03.3.14t.md"
      - ".github/workflows/inventory-regression.yml"
      - ".github/workflows/backup-verification.yml"

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax-check direct runtime and backup verifier
        run: |
          node --check app.js
          ACTIVE_RUNTIME="$(node -e "const fs=require('fs');const s=fs.readFileSync('app.js','utf8');const m=s.match(/loadScript\\('(runtime-v7\\.03\\.3\\.14[a-z]+\\.js)\\?v='/);if(!m)process.exit(2);process.stdout.write(m[1]);")"
          echo "Syntax-checking active runtime: $ACTIVE_RUNTIME"
          node --check "$ACTIVE_RUNTIME"
          node --check modules/parser-evidence-engine.js
          node --check modules/parser-v2/evidence-model.js
          node --check modules/parser-v2/header-resolver.js
          node --check modules/parser-v2/table-detector.js
          node --check modules/parser-v2/row-builder.js
          node --check modules/parser-v2/row-accounting.js
          node --check modules/parser-v2/numbered-schedule.js
          node --check modules/parser-v2/engine.js
          node --check modules/parser-v2/verification-gate.js
          node --check modules/parser-v3/engine.js
          node --check modules/parser-v4-review-bridge.js
          node --check modules/parser-v4_1-shadow.js
          node --check modules/parser-table.js
          node --check modules/grouped-company-ui.js
          node --check modules/backup-verification-ui.js
          node --check scripts/verify-backups.mjs
      - name: Run parser, module, backup and release regression gates
        run: |
          node tests/run-regression.cjs
          node tests/parser-v4-unseen-holdout.cjs
          node tests/parser-v4-concept-sanitized.cjs
          node tests/parser-v4-serial-evidence.cjs
          node tests/parser-v4_1-random-character-shadow.cjs
          node tests/merge-dialog-close-regression.cjs
          node tests/recent-inventory-futuristic-artwork.cjs
