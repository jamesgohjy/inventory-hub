name: Inventory Hub Regression Gate

on:
  push:
    branches: [main]
    paths:
      - "app.js"
      - "v7033-core.js"
      - "parser-v7-core.js"
      - "runtime-v7.03.3.14y.js"
      - "modules/**"
      - "scripts/**"
      - "index.html"
      - "tests/**"
      - "supabase-v7-03-3-14o-parser-intelligence.sql"
      - "supabase-v7-03-3-14d-master-item-merge.sql"
      - "supabase-v7-03-3-14v-canonical-save.sql"
      - "supabase-v7-03-3-14x-data-health-resolution.sql"
      - ".github/workflows/database-migrations.yml"
      - "supabase-v7-03-3-14t-backup-verification.sql"
      - "BACKUP_VERIFICATION_SETUP-v7.03.3.14t.md"
      - ".github/workflows/inventory-regression.yml"
      - ".github/workflows/backup-verification.yml"
  pull_request:
    paths:
      - "app.js"
      - "v7033-core.js"
      - "parser-v7-core.js"
      - "runtime-v7.03.3.14y.js"
      - "modules/**"
      - "scripts/**"
      - "index.html"
      - "tests/**"
      - "supabase-v7-03-3-14o-parser-intelligence.sql"
      - "supabase-v7-03-3-14d-master-item-merge.sql"
      - "supabase-v7-03-3-14v-canonical-save.sql"
      - "supabase-v7-03-3-14x-data-health-resolution.sql"
      - ".github/workflows/database-migrations.yml"
      - "supabase-v7-03-3-14t-backup-verification.sql"
      - "BACKUP_VERIFICATION_SETUP-v7.03.3.14t.md"
      - ".github/workflows/inventory-regression.yml"
      - ".github/workflows/backup-verification.yml"

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax-check direct runtime and backup verifier
        run: |
          node --check app.js
          node --check runtime-v7.03.3.14y.js
          node --check modules/parser-evidence-engine.js
          node --check modules/parser-v2/evidence-model.js
          node --check modules/parser-v2/header-resolver.js
          node --check modules/parser-v2/table-detector.js
          node --check modules/parser-v2/row-builder.js
          node --check modules/parser-v2/row-accounting.js
          node --check modules/parser-v2/numbered-schedule.js
          node --check modules/parser-v2/engine.js
          node --check modules/parser-table.js
          node --check modules/grouped-company-ui.js
          node --check modules/backup-verification-ui.js
          node --check scripts/verify-backups.mjs
      - name: Run parser, module, backup and release regression gates
        run: node tests/run-regression.cjs
