name: Inventory Hub Backup Verification

on:
  schedule:
    # 02:30 Asia/Singapore = 18:30 UTC on the previous calendar day.
    - cron: "30 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inventory-hub-backup-verification
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: https://gmqngayhefjaueosvltj.supabase.co
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check secure setup
        id: setup
        shell: bash
        run: |
          missing=0
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Missing GitHub Actions secret SUPABASE_ACCESS_TOKEN."
            missing=1
          fi
          if [ -z "$SUPABASE_SECRET_KEY" ]; then
            echo "::error::Missing GitHub Actions secret SUPABASE_SECRET_KEY."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "Backup verification is not configured. Follow BACKUP_VERIFICATION_SETUP-v7.03.3.14t.md."
            exit 1
          fi

      - name: Install verifier dependency
        run: npm install --no-save --ignore-scripts @supabase/supabase-js@2

      - name: Verify managed backup, database and documents
        run: node scripts/verify-backups.mjs

      - name: Preserve verification metadata
        if: always() && hashFiles('backup-verification-report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: inventory-backup-verification-${{ github.run_id }}
          path: backup-verification-report.json
          retention-days: 30
          if-no-files-found: error
